# MMBench2 batch 1 (2026-10-11). Own task section so the DINO-WM runs above are unaffected (their runs list no tasks
# and default to the `tasks:` section). Paths are relative to the MMBench2 run directory $MMBENCH2_ROOT/out.
mmbench2:
  checkpoint: {variant: base, hf_repo: nicklashansen/mmbench2-models, hf_revision: b7f7b222526d557f80bf3bcf84ab824cb14f94b0,
               dynamics_sha256: ec28ba7dd40113d1b0e0debfc37df42de0616b39f62dcb01d7ce7431c8803b59,
               tokenizer_sha256: 95e521d36cba21bb47b14e4df4f1d626161c3f8f9955b75443f6b9b0b08fe323}
  inference: {schedule: shortcut, eval_d: 0.125, tau_ctx: 0.0, tau_init: 0.0, ctx_window: 24, kv_cache: true}  # official eval sampler, training-length window
  tasks:
    reacher-easy:
      H_env: 500                 # native episode length (tasks.json max_episode_steps = dataset trajectory length)
      tier: full                 # 2026-10-12: per-state verdict layer + task-level calibration layer
      truth: "fingertip-target distance <= target radius + finger radius (state); reach_anytime primary, final_step logged"
      bank: {path: bank/bank_reacher-easy.pkl, sha256: 36e0aaec806908eb22a28f1d37673c87626fba5a5eb52407322cf7261fd40bb6,
             summary_path: bank/bank_reacher-easy.json, summary_sha256: 644d1654c20803a9e4f2e181c660f3d66604224b1e9a2ee2be959bf09e06919c,
             master_seed: 20261016, n: 100}
      predicate:                 # model-side judge: reads the frame only (no goal image, no planner objective)
        model: "CNN regressor of log fingertip-target distance, trained on real simulator frames only"
        path: predicates/reacher-easy_predicate.pt
        sha256: f90232b5efe5c6e5c849d6b49560bd2b81deecf087bf23a5bb945ff550a3b44b
        calibration_path: predicates/reacher-easy_calibration.json
        calibration_sha256: f9f50624a9d302289f3c6fb9da4bf449fb3cdcbc32e51c502ef2a730a7d3d99d
        threshold_m: 0.05871233149974762    # predicted distance < threshold -> success
        gate: {min_tpr: 0.85, min_tnr: 0.85, evaluations: [holdout_real, holdout_tokenizer_roundtrip, model_generated_1step]}
        measured:                # balanced 50/50 holdouts
          holdout_real: {agreement: 0.955, tpr: 0.979, tnr: 0.931}
          holdout_tokenizer_roundtrip: {agreement: 0.946, tpr: 0.985, tnr: 0.906}
          model_generated_1step: {agreement: 0.950, tpr: 0.983, tnr: 0.916}
        monitor_generated_drift:  # NOT a gate: labels are the simulator's true state, so this mixes predicate error
                                  # with 10-step model drift; used as an upper-bound reference for the predicate-error
                                  # term in false-safe attribution
          model_generated_10step: {agreement: 0.895, tpr: 0.949, tnr: 0.844}
    og-point-maze:
      H_env: 100
      tier: calibration_only     # 2026-10-12: policy-head success 10-15% under both checkpoints -> no room for per-state evaluation
      predicate:                 # 2026-10-12, same recipe as reacher-easy (calibration tier)
        model: "CNN regressor of log ball-goal distance, trained on real simulator frames only"
        path: predicates/og-point-maze_predicate.pt
        sha256: 03767a747a5e682549d32848175971ffdfcfa03b8d048ff2e628829e836f61f2
        calibration_path: predicates/og-point-maze_calibration.json
        calibration_sha256: 63b368a2c029b395c16218e441ecd6b47094c70dbe0496ef40f8ed6f4e1e62bf
        threshold_m: 0.8743599116921663
        gate: {min_tpr: 0.85, min_tnr: 0.85, evaluations: [holdout_real, holdout_tokenizer_roundtrip, model_generated_1step]}
        measured:
          holdout_real: {agreement: 0.968, tpr: 0.979, tnr: 0.957}
          holdout_tokenizer_roundtrip: {agreement: 0.903, tpr: 0.956, tnr: 0.850}   # TNR exactly at the 0.85 line (borderline)
          model_generated_1step: {agreement: 0.978, tpr: 0.997, tnr: 0.959}
        monitor_generated_drift:
          model_generated_10step: {agreement: 0.953, tpr: 0.997, tnr: 0.909}
      bank: {path: bank/bank_og-point-maze.pkl, sha256: ebe4961dc4af24fefd79b6866476f01902157a304123c19306c06fb06e492ade,
             summary_path: bank/bank_og-point-maze.json, summary_sha256: 7e5d1e957cbb78ad72b0122225e4b5fa92f1a5ce2ab18e4dab563e4c86c534cb,
             master_seed: 20261017, n: 100}
      status: "not in batch 1 (base policy head 10% < 20%); combined-checkpoint retest pending"
    mw-reach:
      H_env: 100
      tier: candidate            # 2026-10-12: not in batch 1; decided in batch 2 (base 25% / combined 20% at sigma 0.1)
      bank: {path: bank/bank_mw-reach.pkl, sha256: 43aef6f74d01c7f1ddfe289e777b9691dca09ba94bbf5ae8bba52bfaa5721e09,
             summary_path: bank/bank_mw-reach.json, summary_sha256: 8d9c828531c3347046dde6b24fed049eb70f3cd9a801f5fd8ef342fd0cb86dee,
             master_seed: 20261018, n: 100}
      status: "not in batch 1 (base policy head 15% < 20%); combined-checkpoint retest pending"
  policy:                       # 2026-10-11: the evaluated object is this stochastic policy (both branches)
    source: "checkpoint behaviour-cloning policy head (base), closed loop; real branch: context = encodings of real
             frames; imagined branch: context = generated latents; 24-frame window"
    sigma: 0.1                   # action = clip(head(h_t) + sigma * eps_t, -1, 1), eps identical in both branches
    sigma_selection_rule: "pre-registered: sigma > 0 from {0.05,0.1,0.15,0.2,0.3} whose reach_anytime success on the
                           first 20 frozen starts (noise seed k=0) is closest to 50% (ties -> smaller sigma)"
    sigma_sweep: {0.0: 0.25, 0.05: 0.35, 0.1: 0.55, 0.15: 0.60, 0.2: 0.70, 0.3: 0.60}   # out/step2b_sigma_sweep.json
    deterministic_reference: "sigma = 0 (head only) is kept in the analysis as the K=1 degenerate case: it makes the
                              real branch deterministic, so truth cannot be expressed as a proportion"
    noise_master_seed: 20261019  # seed_ik = RandomState(m).randint(0, 2**31-1, (N=100, K=5))[i, k]; eps_ik = RandomState(seed_ik).randn(H, A)
    seeds_per_start: 5
  verdict_rule: {model_accept_min: 4, truth_success_min: 4, criterion: reach_anytime, also_logged: final_step}
  perturbations:                # MMBench2 settings; perturbation families to be added after step-5 values are fixed
    reacher-easy:
      none: {family: null, severity: 0, spec: {}}
      mm-act-1: {family: mm-act, severity: 1, spec: {gear_scale: 0.9}}    # 2026-10-12, levels as DINO-WM stage-2 s2-pm-act
      mm-act-2: {family: mm-act, severity: 2, spec: {gear_scale: 0.8}}
      mm-act-3: {family: mm-act, severity: 3, spec: {gear_scale: 0.7}}
      mm-act-4: {family: mm-act, severity: 4, spec: {gear_scale: 0.6}}
      mm-act-5: {family: mm-act, severity: 5, spec: {gear_scale: 0.4}}
      mm-rot-1: {family: mm-rot, severity: 1, spec: {action_rotation_deg: 3.0}}   # joint-space rotation; levels as s2-wall-rot
      mm-rot-2: {family: mm-rot, severity: 2, spec: {action_rotation_deg: 5.0}}
      mm-rot-3: {family: mm-rot, severity: 3, spec: {action_rotation_deg: 8.0}}
      mm-rot-4: {family: mm-rot, severity: 4, spec: {action_rotation_deg: 12.0}}
      mm-rot-5: {family: mm-rot, severity: 5, spec: {action_rotation_deg: 20.0}}
      mm-sham: {family: null, severity: 0, spec: {}, sham: true}
  tier_definitions:              # 2026-10-12 (also a formal-spec TODO)
    full: "per-state verdict layer (2x2, false-safe rate, REJECT hit rate, AUROC) + task-level calibration layer;
           requires the policy's real success rate in [20%, 95%]"
    calibration_only: "task-level calibration layer only (real success rate vs model-estimated success rate =
                       ACCEPT proportion); no success-rate band required"
    candidate: "not yet assigned"

# 2026-10-12 DINO-WM independent-predicate experiment (out/indep/analysis_indep_predicate.md). Replaces the planner
# self-scoring judge (feat_dist < tasks.<t>.threshold) by a pixel judge independent of the planning objective, applied
# to decoded imagined frames (VQ-VAE decoder of the checkpoint); goal frame = the real bank goal observation.
# Pre-registered A/B rule in the report. Existing entries above are unchanged. Perturbations: the top-level ones.
dino_wm_indep:
  readout: {primary: "reach_anytime: any of the 21 imagined frames (env steps 0,5,..,100) judged inside",
            also: "last imagined frame (same read-out as the self-scoring judge; verify_run model_verdict field)"}
  tasks:
    wall:
      success_tol: 4.5
      H_env: 100
      predicate:
        kind: detector             # step-1 ruling 2026-10-12: the Wall CNN failed the gate (precedent #4)
        model: "non-learned red-dot detector: redness-weighted pixel centroid (R-(G+B)/2 > 40) -> affine map to
                world xy (fitted on 2000 real frames); distance = ||xy(imagined frame) - xy(real goal frame)||"
        path: indep/predicates/wall_detector_params.json
        sha256: 9b60e9ebbb4ab06feee8228176b81d517ea7eeeb7ce66e28034dacd405d87782
        calibration_path: indep/predicates/wall_detector_calibration.json
        calibration_sha256: 46b19725d60f4f3f96f34332475ef7bdea6628d21b8be2c9aa8d5ee31d6e1360
        threshold_m: 4.449309056225771       # detector distance < threshold -> inside (truth tol 4.5)
        gate: {min_tpr: 0.85, min_tnr: 0.85, evaluations: [holdout_real, holdout_wm_roundtrip, model_generated_1step]}
        measured:                  # 1 step = 1 macro step = 5 env steps (MMBench2: 1 env step)
          holdout_real: {agreement: 0.993, tpr: 0.986, tnr: 1.000}
          holdout_wm_roundtrip: {agreement: 0.995, tpr: 0.990, tnr: 1.000}
          model_generated_1step: {agreement: 0.980, tpr: 0.973, tnr: 0.987}
        monitor_generated_drift:   # NOT a gate; upper bound for the predicate-error term in attribution
          model_generated_10step: {agreement: 0.843, tpr: 0.718, tnr: 0.970}
          model_generated_20step: {agreement: 0.798, tpr: 0.640, tnr: 0.957}
        rejected_candidate: "localiser CNN (indep/predicates/wall_indep_predicate.pt, sha256 7adde8db...): model_generated_1step
                             TPR 0.800 < 0.85 -- misreads faint/blurred decoded dots (wall_gate_diagnostic.json)"
    point_maze:
      success_tol: 0.5
      H_env: 100
      predicate:
        kind: cnn
        model: "CNN agent localiser (xy) on single real frames (+2 coordinate channels); distance =
                ||xy(imagined frame) - xy(real goal frame)||; trained on real simulator frames only"
        path: indep/predicates/point_maze_indep_predicate.pt
        sha256: 9dea2d6c36293bf9193ec17e92e3cdb7eed6c656f60c70e7a764b1c205e61a48
        calibration_path: indep/predicates/point_maze_indep_calibration.json
        calibration_sha256: bda8414bac5d95b4b0a71ec8a510aaf7eca8c45fae95682f8df8c785481ec167
        threshold_m: 0.4999811098666373      # truth tol 0.5
        gate: {min_tpr: 0.85, min_tnr: 0.85, evaluations: [holdout_real, holdout_wm_roundtrip, model_generated_1step]}
        measured:
          holdout_real: {agreement: 0.9965, tpr: 0.998, tnr: 0.995}
          holdout_wm_roundtrip: {agreement: 0.9925, tpr: 0.995, tnr: 0.989}
          model_generated_1step: {agreement: 0.890, tpr: 0.863, tnr: 0.919}
        monitor_generated_drift:
          model_generated_10step: {agreement: 0.773, tpr: 0.709, tnr: 0.845}
          model_generated_20step: {agreement: 0.932, tpr: 0.910, tnr: 0.955}

# 2026-10-14 LIBERO batch (virtual only: "real" = the LIBERO simulator truth branch). Design: libero/eval_design.md.
# Shared by all models; perturbation settings are added here after the dose plan is approved.
libero:
  scope: "virtual environment only; real = LIBERO simulator truth branch; transfer = imagined verdict -> simulator execution"
  env: {conda_env: lerobot_libero, hf_libero: 0.1.4, robosuite: 1.4.0, mujoco: 3.8.1, wrapper: "lerobot.envs.libero.LiberoEnv"}
  suite: libero_10
  H_env: 520                    # LeRobot libero_10 TASK_SUITE_MAX_STEPS; truth branch for every model
  success: "LIBERO native check_success (BDDL goal conjunction), reach_anytime (diamond class): success at any step <= H"
  tasks:
    t5: {task_id: 5, name: STUDY_SCENE1_pick_up_the_book_and_place_it_in_the_back_compartment_of_the_caddy, stage_kind: single-stage}
    t3: {task_id: 3, name: KITCHEN_SCENE4_put_the_black_bowl_in_the_bottom_drawer_of_the_cabinet_and_close_it, stage_kind: multi-stage}
  anchors:
    path: libero/out/bank/libero_anchors.json
    sha256: 4c4cc503e692b35bf710fe25b08d85ff916e9fee78a584094a0c1dfb7e9ac5d7
    verify: {path: libero/out/bank/anchor_verify.json, all_pass: true, tolerance: 0.0, replay_steps: 120,
             cross_process: "identical trajectory sha256 in two separate processes"}
    master_seed: 20261025       # rs = RandomState(m); per task in order (3, 5): idx = rs.choice(50, 5, replace=False); seeds = rs.randint(0, 2**31-1, 5)
    per_task: 5
    settle_steps: 10
    resolution: 128
    restore: "a NEW LiberoEnv(hard_reset=True, init_states=True) per restore -> reset(seed); a reused env drifts fixture
              poses (LIBERO appends to object_property_initializers on every hard reset; libero_native_hooks.md section 8)"
  worldvla:                     # 2026-10-15 frozen per eval_design section 16 (worldvla_unit.py refuses other values)
    wm_prompt: helper           # "Generate the image based on the current image and the action." + <|image|><|action|>
    instr: name                 # 2026-10-15 ruling 3: official 10-task comparison closer to the paper with the training-folder
                                #   instruction (task.name, "_" -> " "): 0.53 vs 0.52 (task.language); paper suite mean 0.59
    official_comparison: {variant: name, suite_mean: 0.53, n: 100, wilson95: [0.433, 0.625], other_variant: {language: 0.52}}
    wm_prompt_selection: {file: libero/out/worldvla/prompt_select/onestep_official_task5.json,
                          sha256: 6eee765542e4045e1f11db2f11e57df28c24297878c4fdd2cc939911adc18ffc,
                          rule: "max mean one-step PSNR on 60 recorded official-eval transitions (task 5, seed 20261015)",
                          mean_psnr: {helper: 24.266, paper: 24.246, train: 24.154}, structural_fallbacks: {helper: 0, paper: 0, train: 56}}

  openwam_alpha:                # 2026-10-23 ruling: precheck closed, formal integration; chaining = calibrated controller
    checkpoint: {hf_repo: OpenWAM/OpenWAM-Alpha-Sim-LIBERO, file: checkpoint_step_10690.safetensors, repo: OpenWAM-Official/OpenWAM,
