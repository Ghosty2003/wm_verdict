verify:
  env_adapter: "env_adapter:replay_unit"   # module:function used only by check 2 (truth replay spot-check)
  restore_spot_check: {n_states: 2, seed: 20261008, atol: 0.0}

# Archive minimum per unit (user rule 2026-11-13, effective immediately, forward only: F family, open-loop supplement,
# 4090 and every later run; existing data is not retroactive). Enforced at three points:
#   1. runner: libero/min_artifacts.py assert_unit() after the unit npz is written and BEFORE its records row is written;
#      any missing item raises -> the job stops, no row is written;
#   2. verify_run.py check 10 (and `python libero/min_artifacts.py verify ...`): sample completed units, reopen the npz,
#      check keys / lengths; out/artifact_verify/<name>.json is the per-cell result;
#   3. out/task2/make_snapshot.py: a cell from a covered source file is "complete" only if n >= 50 AND its artifact
#      verification passed (otherwise complete = "artifacts_unverified").
# A key list "a|b" means any one of the alternatives satisfies the item. Pass-2 keys of the paired protocol carry the
# prefix run2_ and must satisfy the same list.
min_artifacts:
  version: 1
  effective: 2026-11-13
  record_fields:                       # every records row
    - unit_id
    - setting_id
    - perturbation                     # full perturbation spec (dict)
    - imagination_seed|seed            # seed(s) of the unit
    - machine
    - gpu
    - closed_loop.success|real_verdict # outcome
    - closed_loop.first_success_step|real_first_success_step   # key must exist (value may be null on failure)
    - closed_loop_file|trajectory_file # path (relative to repo root) of the unit npz
  closed_loop:                         # npz keys, per pass (pass 2 = run2_ prefix)
    actions_commanded: [commanded]
    actions_executed: [executed]
    success_per_step: [success]
    imagined_per_planning_call: [imag_latents_00, imagined, latents_00]       # latent or frames, at least one
    observations_read_per_call: [imag_real_00__observation_images_image, read_agentview]
    checks:
      - len(executed) == len(commanded) == len(success) == closed_loop.steps (pass 1; pass 2 against rerun.steps when recorded)
      - any(success) == closed_loop.success; first True index + 1 == closed_loop.first_success_step
  open_loop:
    imagined_full_sequence: [latents, imagined_canvas, imagined]
    judge_input_frames: [judge_frames]
    actions_imagined: [env, imagined_actions]
    actions_executed_truth_replay: [replay1]
  verify_sample_per_cell: 5            # verify_run check 10 / min_artifacts.py verify default
  applies_to:                          # closed_main source files whose cells need artifact verification to be "complete"
    - lingbot_famF.jsonl
    - openwam_famF.jsonl
  storage_per_unit_estimate_MB:        # measured on 2026-11-13 files (zip compressed sizes); 2 passes per unit
    lingbot_closed_minimum: 28         # read obs 13.2 + imagined latents 0.56 + actions/success 0.02, per pass
    openwam_closed_minimum: 40         # imagined frames 17.8 + read obs 2.2 + actions/success/states 0.2, per pass
    lingbot_closed_current_runner: 45  # + per-step agentview/wrist 8.8 per pass (store-all rule)
  derived_local_only:                  # 2026-11-14：由存档派生、只留 NAS 不传 Dropbox 的数据（可由脚本从存档逐位重建）
    - path: libero/out/f_family/cases/cache/
      content: "OpenWAM-α F 族失败单元（T1 F160 17 个、T3 F60 19 个）的逐步主视角真实帧回放 + 置黑调用/前一调用想象帧（正视）"
      files: 36
      bytes: 1139309906
      source: "存档 commanded 动作在同一锚点重放（不调模型）；逐步 full-physics state 与存档 states、调用步画面与 read_agentview 均逐位相同（36/36）"
      rebuild: "libero/ffam/f_cases.py prep（lerobot_libero，需 EGL）"
      dropbox: false
      used_by: libero/out/f_family/cases/README.md

