# WM-Verdict protocol file: single authoritative source for every judgement parameter of a run.
# Scripts (step5_baseline.py, step7_perturbed.py, verify_run.py) read these values; nothing is hard-coded.
# Paths are relative to the run directory (--run-dir).
protocol_version: 1
H_env: 100                     # protocol horizon in env steps; both branches are judged at step H_env

tasks:
  wall:                       # Wall (DINO-WM DotWall)
    success_tol: 4.5             # truth predicate: ||xy_final - xy_goal|| < success_tol
    threshold: 0.19651249796152115   # model predicate: feat_dist < threshold (step-4 calibrated, ~0.197)
    holdout_agreement_floor: 0.985   # check 3 lower bound (= measured step-4 holdout agreement)
    bank:
      path: bank/bank_wall.pkl
      sha256: 4770dd8ae1fca58383a9242637bc2590c16fb6daac793d16be9c1e1b53787de3
      summary_path: bank/bank_wall.json
      summary_sha256: 7eec61461af666097c96d1f41c8ce1fb2311dc52bfad1a3f17b3b3eee4d165ae
    calibration:
      summary_path: step4_calibration_wall.json
      summary_sha256: 3eb2500ebb4303a92d946aef85b91ea4eadb8b2382e468d93cdb79dff9a12bba
      pairs_path: step4_calibration_wall.jsonl
      pairs_sha256: 8ad87b588befe01941eef8a9ab3de05949ece002bc35bf8d2e5a532312f5fae7
  point_maze:                       # PointMaze (DINO-WM MuJoCo U-maze)
    success_tol: 0.5             # truth predicate: ||xy_final - xy_goal|| < success_tol
    threshold: 0.10575883463025093   # model predicate: feat_dist < threshold (step-4 calibrated, ~0.106)
    holdout_agreement_floor: 0.915   # check 3 lower bound (= measured step-4 holdout agreement)
    bank:
      path: bank/bank_point_maze.pkl
      sha256: 7c35066d14360adedc2e5f4db917cdf0a744cb2b390d431ae37f937144797f5d
      summary_path: bank/bank_point_maze.json
      summary_sha256: b9f324a9aada1609ebf92eb87eed7a15bf6dfe22a54f4b3159c8eb2b19e5651e
    calibration:
      summary_path: step4_calibration_point_maze.json
      summary_sha256: dbc14564510a34dcff75b386c64fd9c3d9260df9867f6c267353cb5dc8d866d8
      pairs_path: step4_calibration_point_maze.jsonl
      pairs_sha256: b2054203d01709f5048b2e0f338de79348541c6efe1512cc56dfdb872b8b04ed

# Perturbation settings: id -> family, severity (0 = none/sham), truth-branch parameter overrides.
# "none" is the unperturbed baseline (step 5). Sham = all defaults, re-run (step 7).
perturbations:
  wall:
    none:        {family: null, severity: 0, spec: {}}
    wall-sham:   {family: null, severity: 0, spec: {}, sham: true}
    wall-gain-1: {family: wall-gain, severity: 1, spec: {speed_gain: 1.6}}
    wall-gain-2: {family: wall-gain, severity: 2, spec: {speed_gain: 1.2}}
    wall-gain-3: {family: wall-gain, severity: 3, spec: {speed_gain: 0.8}}
    wall-rot-1:  {family: wall-rot, severity: 1, spec: {action_rotation_deg: 5.0}}
    wall-rot-2:  {family: wall-rot, severity: 2, spec: {action_rotation_deg: 10.0}}
    wall-rot-3:  {family: wall-rot, severity: 3, spec: {action_rotation_deg: 20.0}}
    # stage 2 (2026-10-09): 5 levels per family, light end densified, heavy end kept as a saturation anchor
    s2-wall-gain-1: {family: s2-wall-gain, severity: 1, spec: {speed_gain: 1.8}}
    s2-wall-gain-2: {family: s2-wall-gain, severity: 2, spec: {speed_gain: 1.6}}
    s2-wall-gain-3: {family: s2-wall-gain, severity: 3, spec: {speed_gain: 1.4}}
    s2-wall-gain-4: {family: s2-wall-gain, severity: 4, spec: {speed_gain: 1.2}}
    s2-wall-gain-5: {family: s2-wall-gain, severity: 5, spec: {speed_gain: 0.8}}
    s2-wall-rot-1:  {family: s2-wall-rot, severity: 1, spec: {action_rotation_deg: 3.0}}
    s2-wall-rot-2:  {family: s2-wall-rot, severity: 2, spec: {action_rotation_deg: 5.0}}
    s2-wall-rot-3:  {family: s2-wall-rot, severity: 3, spec: {action_rotation_deg: 8.0}}
    s2-wall-rot-4:  {family: s2-wall-rot, severity: 4, spec: {action_rotation_deg: 12.0}}
    s2-wall-rot-5:  {family: s2-wall-rot, severity: 5, spec: {action_rotation_deg: 20.0}}
  point_maze:
    none:        {family: null, severity: 0, spec: {}}
    pm-sham:     {family: null, severity: 0, spec: {}, sham: true}
    pm-act-1:    {family: pm-act, severity: 1, spec: {gear_scale: 0.8}}
    pm-act-2:    {family: pm-act, severity: 2, spec: {gear_scale: 0.6}}
    pm-act-3:    {family: pm-act, severity: 3, spec: {gear_scale: 0.4}}
    pm-dt-1:     {family: pm-dt, severity: 1, spec: {timestep: 0.011}}
    pm-dt-2:     {family: pm-dt, severity: 2, spec: {timestep: 0.013}}
    pm-dt-3:     {family: pm-dt, severity: 3, spec: {timestep: 0.015}}
    # stage 2 (2026-10-09)
    s2-pm-act-1:    {family: s2-pm-act, severity: 1, spec: {gear_scale: 0.9}}
    s2-pm-act-2:    {family: s2-pm-act, severity: 2, spec: {gear_scale: 0.8}}
    s2-pm-act-3:    {family: s2-pm-act, severity: 3, spec: {gear_scale: 0.7}}
    s2-pm-act-4:    {family: s2-pm-act, severity: 4, spec: {gear_scale: 0.6}}
    s2-pm-act-5:    {family: s2-pm-act, severity: 5, spec: {gear_scale: 0.4}}
    s2-pm-dt-1:     {family: s2-pm-dt, severity: 1, spec: {timestep: 0.0105}}
    s2-pm-dt-2:     {family: s2-pm-dt, severity: 2, spec: {timestep: 0.011}}
    s2-pm-dt-3:     {family: s2-pm-dt, severity: 3, spec: {timestep: 0.012}}
    s2-pm-dt-4:     {family: s2-pm-dt, severity: 4, spec: {timestep: 0.013}}
    s2-pm-dt-5:     {family: s2-pm-dt, severity: 5, spec: {timestep: 0.015}}

# Runs that live in a run directory. baseline_run: the run sham / dose checks are compared against.
runs:
  step5:
    machine: "$NODE_D (presumed; not probed -- the 2026-10-20 probe covered the LIBERO banks only)"
    records: "step5_records_{task}.jsonl"
    summary: step5_summary.json
    settings: [none]
    baseline_run: null
  step7:
    machine: "$NODE_D (presumed; not probed -- the 2026-10-20 probe covered the LIBERO banks only)"
    records: "step7_records_{task}.jsonl"
    summary: step7_summary.json
    settings: [wall-gain-1, wall-gain-2, wall-gain-3, wall-rot-1, wall-rot-2, wall-rot-3, wall-sham,
               pm-act-1, pm-act-2, pm-act-3, pm-dt-1, pm-dt-2, pm-dt-3, pm-sham]
    baseline_run: step5
  step5h:                       # 2026-10-09: Wall hard-start baseline (same protocol as step5, other bank)
    machine: "$NODE_D (presumed; not probed -- the 2026-10-20 probe covered the LIBERO banks only)"
    records: "step5h_records_{task}.jsonl"
    summary: step5h_summary.json
    settings: [none]
    baseline_run: null
    tasks: [wall]
    banks: {wall: wall_hard}     # -> banks.wall_hard (instead of tasks.wall.bank)
  step7h:                       # 2026-10-09: hard-start bank x the Wall step-7 perturbations (truth branch only)
    machine: "$NODE_D (presumed; not probed -- the 2026-10-20 probe covered the LIBERO banks only)"
    records: "step7h_records_{task}.jsonl"
    summary: step7h_summary.json
    settings: [wall-gain-1, wall-gain-2, wall-gain-3, wall-rot-1, wall-rot-2, wall-rot-3, wall-sham]
    baseline_run: step5h          # model branch reused from step5h; sham compared against step5h
    tasks: [wall]
    banks: {wall: wall_hard}
  stage2_base:                  # 2026-10-09: stage 2 baseline: K planner seeds per start, unperturbed truth
    machine: "$NODE_D (presumed; not probed -- the 2026-10-20 probe covered the LIBERO banks only)"
    records: "stage2_base_records_{task}.jsonl"
    summary: stage2_base_summary.json
    settings: [none]
    baseline_run: null
    banks: {wall: s2_wall, point_maze: s2_point_maze}
    seeds_per_start: 5
  stage2_pert:                  # 2026-10-09: stage 2 perturbations (truth branch only; model branch from stage2_base)
    machine: "$NODE_D (presumed; not probed -- the 2026-10-20 probe covered the LIBERO banks only)"
    records: "stage2_pert_records_{task}.jsonl"
    summary: stage2_pert_summary.json
    settings: [s2-wall-gain-1, s2-wall-gain-2, s2-wall-gain-3, s2-wall-gain-4, s2-wall-gain-5, s2-wall-rot-1, s2-wall-rot-2, s2-wall-rot-3, s2-wall-rot-4, s2-wall-rot-5, wall-sham,
               s2-pm-act-1, s2-pm-act-2, s2-pm-act-3, s2-pm-act-4, s2-pm-act-5, s2-pm-dt-1, s2-pm-dt-2, s2-pm-dt-3, s2-pm-dt-4, s2-pm-dt-5, pm-sham]
    baseline_run: stage2_base
    banks: {wall: s2_wall, point_maze: s2_point_maze}
    seeds_per_start: 5

  mmb_min:                      # 2026-10-11 MMBench2 reacher-easy minimal pairing (2 starts x 5 noise seeds)
    machine: "$NODE_D (presumed; not probed -- the 2026-10-20 probe covered the LIBERO banks only)"
    records: "mmb_min_records_{task}.jsonl"
    summary: mmb_min_summary.json
    settings: [none]
    baseline_run: null
    task_section: mmbench2       # tasks / banks / predicate come from the `mmbench2:` section
    tasks: [reacher-easy]
    seeds_per_start: 5
    max_starts: 2
    run_dir_hint: $MMBENCH2_ROOT/out
    env_adapter: "mmb_env_adapter:replay_unit"
  mmb_base:                     # 2026-10-11 MMBench2 reacher-easy baseline (100 starts x 5 noise seeds)
    machine: "$NODE_D (presumed; not probed -- the 2026-10-20 probe covered the LIBERO banks only)"
    records: "mmb_base_records_{task}.jsonl"
    summary: mmb_base_summary.json
    settings: [none]
    baseline_run: null
    task_section: mmbench2
    tasks: [reacher-easy]
    seeds_per_start: 5
    run_dir_hint: $MMBENCH2_ROOT/out
    env_adapter: "mmb_env_adapter:replay_unit"
  mmb_dose:                     # 2026-10-12 dose check: first 2 starts x 5 seeds x 10 non-sham settings
    machine: "$NODE_D (presumed; not probed -- the 2026-10-20 probe covered the LIBERO banks only)"
    records: "mmb_dose_records_{task}.jsonl"
    settings: [mm-act-1, mm-act-2, mm-act-3, mm-act-4, mm-act-5, mm-rot-1, mm-rot-2, mm-rot-3, mm-rot-4, mm-rot-5]
    baseline_run: mmb_base
    task_section: mmbench2
    tasks: [reacher-easy]
    seeds_per_start: 5
    max_starts: 2
    run_dir_hint: $MMBENCH2_ROOT/out
    env_adapter: "mmb_env_adapter:replay_unit"
  mmb_pert:                     # 2026-10-12 perturbations: 100 starts x 5 seeds x 11 settings (truth only; model from mmb_base)
    machine: "$NODE_D (presumed; not probed -- the 2026-10-20 probe covered the LIBERO banks only)"
    records: "mmb_pert_records_{task}.jsonl"
    summary: mmb_pert_summary.json
    settings: [mm-act-1, mm-act-2, mm-act-3, mm-act-4, mm-act-5, mm-rot-1, mm-rot-2, mm-rot-3, mm-rot-4, mm-rot-5, mm-sham]
    baseline_run: mmb_base
    task_section: mmbench2
    tasks: [reacher-easy]
    seeds_per_start: 5
    chunking: "identical to mmb_base (unit order (start, seed), chunks of 40) so GPU policy batches are bit-identical"
    run_dir_hint: $MMBENCH2_ROOT/out
    env_adapter: "mmb_env_adapter:replay_unit"
  mmb_og_cal:                   # 2026-10-12 og-point-maze calibration tier: 20 starts x 5 noise seeds, both branches
    machine: "$NODE_D (presumed; not probed -- the 2026-10-20 probe covered the LIBERO banks only)"
    records: "mmb_og_cal_records_{task}.jsonl"
    settings: [none]
    baseline_run: null
    task_section: mmbench2
    tasks: [og-point-maze]
    seeds_per_start: 5
    max_starts: 20
    run_dir_hint: $MMBENCH2_ROOT/out
    env_adapter: "mmb_env_adapter:replay_unit"
  indep_stage2_base:            # 2026-10-12 independent-predicate re-read of stage2_base (no re-planning, no new truth)
    machine: "$NODE_D (presumed; not probed -- the 2026-10-20 probe covered the LIBERO banks only)"
    records: "indep/indep_records_stage2_base_{task}.jsonl"
    settings: [none]
    baseline_run: null
    task_section: dino_wm_indep
    banks: {wall: s2_wall, point_maze: s2_point_maze}
    seeds_per_start: 5
  indep_stage2_pert:            # 2026-10-12 independent-predicate re-read of stage2_pert (truth fields copied unchanged)
    machine: "$NODE_D (presumed; not probed -- the 2026-10-20 probe covered the LIBERO banks only)"
    records: "indep/indep_records_stage2_pert_{task}.jsonl"
    settings: [s2-wall-gain-1, s2-wall-gain-2, s2-wall-gain-3, s2-wall-gain-4, s2-wall-gain-5, s2-wall-rot-1, s2-wall-rot-2, s2-wall-rot-3, s2-wall-rot-4, s2-wall-rot-5, wall-sham,
               s2-pm-act-1, s2-pm-act-2, s2-pm-act-3, s2-pm-act-4, s2-pm-act-5, s2-pm-dt-1, s2-pm-dt-2, s2-pm-dt-3, s2-pm-dt-4, s2-pm-dt-5, pm-sham]
    baseline_run: indep_stage2_base
    task_section: dino_wm_indep
    banks: {wall: s2_wall, point_maze: s2_point_maze}
    seeds_per_start: 5
  indep_step5h:                 # 2026-10-12 independent-predicate re-read of step5h (Wall hard starts)
    machine: "$NODE_D (presumed; not probed -- the 2026-10-20 probe covered the LIBERO banks only)"
    records: "indep/indep_records_step5h_{task}.jsonl"
    settings: [none]
    baseline_run: null
    task_section: dino_wm_indep
    tasks: [wall]
    banks: {wall: wall_hard}
  indep_step7h:                 # 2026-10-12 independent-predicate re-read of step7h
    machine: "$NODE_D (presumed; not probed -- the 2026-10-20 probe covered the LIBERO banks only)"
    records: "indep/indep_records_step7h_{task}.jsonl"
    settings: [wall-gain-1, wall-gain-2, wall-gain-3, wall-rot-1, wall-rot-2, wall-rot-3, wall-sham]
    baseline_run: indep_step5h
    task_section: dino_wm_indep
    tasks: [wall]
    banks: {wall: wall_hard}
  wall_rand_ctrl:               # 2026-10-12 random-action control (TODO 14, optimisation-pressure hypothesis); Wall only
    machine: "$NODE_D (presumed; not probed -- the 2026-10-20 probe covered the LIBERO banks only)"
    records: "rand_ctrl/wall_rand_ctrl_records_{task}.jsonl"
    settings: [none]
    baseline_run: null
    task_section: dino_wm_indep  # judge: the Wall red-dot detector (dino_wm_indep.tasks.wall.predicate)
    tasks: [wall]
    banks: {wall: s2_wall}
    seeds_per_start: 5
    actions:
      source: "uniform random, NOT optimised; 100 env steps (= 20 macro actions x frameskip 5), same length as CEM plans"
      distribution: "uniform (by area) in the disk |a| <= 1.8 per env step (support of the training-data action
                     generator: step length truncnorm on [0.2, 1.8], any direction; the env itself is unbounded)"
      master_seed: 20261020      # seeds = RandomState(m).randint(0, 2**31-1, 250); start i, sequence k -> seeds[5i+k]
    empty_frame_rule: "a frame with no red pixel (redness R-(G+B)/2 > 40) is read as distance = inf (never inside);
                       first pre-registered instance of formal-phase TODO 15"
    readout: {primary: reach_anytime (any of 21 imagined frames), also: final frame}
  wall_selpress_p025:           # 2026-10-12 selection-pressure dose curve, CEM population x0.25 (DINO-WM closing experiment)
    machine: "$NODE_D (presumed; not probed -- the 2026-10-20 probe covered the LIBERO banks only)"
    records: "selpress/wall_selpress_p025_records_{task}.jsonl"
    cem: {topk: 8, num_samples: 75, var_scale: 1, opt_steps: 30, eval_every: 1}    # elites 30 x 0.25 = 7.5 -> 8
    settings: [none]
    baseline_run: null
    task_section: dino_wm_indep  # judge: Wall red-dot detector; empty-frame rule as wall_rand_ctrl (no red pixel -> inf)
    tasks: [wall]
    banks: {wall: s2_wall}
    max_starts: 10               # s2_wall_n00..n09, fixed in advance (not chosen by outcome)
    seeds_per_start: 5
    planner_master_seed: 20261021   # seeds = RandomState(m).randint(0, 2**31-1, (2, 10, 5)); [0] x0.25, [1] x4
    empty_frame_rule: "no red pixel (redness > 40) -> distance inf (as wall_rand_ctrl)"
    x1_reference: "x1 level = stage2_base CEM (topk 30, num_samples 300) for the same 10 starts x 5 seeds, re-read in
                   rand_ctrl/cem_reread_wall.jsonl (planning does not use the judge; re-read verdicts 250/250 identical)"
  wall_selpress_p4:             # 2026-10-12 selection-pressure dose curve, CEM population x4
    machine: "$NODE_D (presumed; not probed -- the 2026-10-20 probe covered the LIBERO banks only)"
    records: "selpress/wall_selpress_p4_records_{task}.jsonl"
    cem: {topk: 120, num_samples: 1200, var_scale: 1, opt_steps: 30, eval_every: 1}
    settings: [none]
    baseline_run: null
    task_section: dino_wm_indep  # judge: Wall red-dot detector; empty-frame rule as wall_rand_ctrl (no red pixel -> inf)
    tasks: [wall]
    banks: {wall: s2_wall}
    max_starts: 10               # s2_wall_n00..n09, fixed in advance (not chosen by outcome)
    seeds_per_start: 5
    planner_master_seed: 20261021   # seeds = RandomState(m).randint(0, 2**31-1, (2, 10, 5)); [0] x0.25, [1] x4
    empty_frame_rule: "no red pixel (redness > 40) -> distance inf (as wall_rand_ctrl)"
    x1_reference: "x1 level = stage2_base CEM (topk 30, num_samples 300) for the same 10 starts x 5 seeds, re-read in
                   rand_ctrl/cem_reread_wall.jsonl (planning does not use the judge; re-read verdicts 250/250 identical)"
  mmb_cem:                      # 2026-10-13 MMBench2 action-source replacement (TODO 18): open-loop CEM arm, reacher-easy
    machine: "$NODE_D (presumed; not probed -- the 2026-10-20 probe covered the LIBERO banks only)"
    records: "mmb_cem_records_{task}.jsonl"
    settings: [none]
    baseline_run: null
    task_section: mmbench2       # same model, task, starts, H, predicate as mmb_base; only the action source changes
    tasks: [reacher-easy]
    seeds_per_start: 5
    max_starts: 100              # cost gate may reduce to 50 (first 50 of the bank); recorded in the report
    run_dir_hint: $MMBENCH2_ROOT/out
    env_adapter: "mmb_env_adapter:replay_unit"
    planner_master_seed: 20261022   # seeds = RandomState(m).randint(0, 2**31-1, (100, 5))[i, k]
    cem: {n_samples: 256, n_elites: 32, n_iters: 4, init_std: 1.0, min_std: 0.05, noise_beta: 0.0, rollout_batch: 128}
                                 # = repo plan_cem.py CLI defaults; returns the single best sample seen (repo semantics)
    cost: "minus the sum over the H planned steps of the reward head's predicted reward (repo plan_cem.reward_cost);
           the frame predicate is NOT used as the cost"
    horizon: 500                 # open loop over the full H_env
    model_readout: {scored: "the imagined rollout CEM scored when selecting the plan (primary, as DINO-WM)",
                    fresh: "an independent re-imagination of the selected plan (reported alongside)"}
    bc_reference: mmb_base       # BC policy head, sigma 0.1, 5 noise seeds; existing records, not re-run
  mmb_bon_n1:                 # 2026-10-13 MMBench2 best-of-N selection (TODO 18 + 17; replaces mmb_cem), N = 1
    machine: "$NODE_D (presumed; not probed -- the 2026-10-20 probe covered the LIBERO banks only)"
    records: "mmb_bon_n1_records_{task}.jsonl"
    N: 1
    settings: [none]
    baseline_run: null
    task_section: mmbench2       # model, task, starts, H, predicate, policy (sigma 0.1), inference as mmb_base
    tasks: [reacher-easy]
    seeds_per_start: 5
    max_starts: 50               # first 50 frozen starts (s000..s049)
    run_dir_hint: $MMBENCH2_ROOT/out
    env_adapter: "mmb_env_adapter:replay_unit"
    candidates: 64               # per (start, seed): 64 candidates imagined once, shared by all N levels
    noise_master_seed: 20261023  # seeds = RandomState(m).randint(0, 2**31-1, (50, 5, 64)); eps = RandomState(seed).randn(500, A)
    candidate_definition: "one noise sequence eps of the protocol policy (BC head + 0.1 eps); imagined closed loop in the
                           world model (mmb_run rollout); executing it = the protocol policy closed loop in the REAL env
                           with the same eps (as mmb_base truth)"
    selection_rule: "argmax of the reward head's predicted return (sum over the 500 imagined steps, plan_cem.reward_cost
                     convention) over candidates 0..N-1 (nested prefixes); ties -> lowest index; N = 1 -> candidate 0"
    model_readout: {scored: "the selected candidate's own imagined rollout (the one it was selected on; primary)",
                    fresh: "independent re-imagination of the selected eps (out/bon/fresh.jsonl)"}
    bc_reference: mmb_base       # N = 1 internal consistency check against mmb_base starts 0..49 (pre-registered)
    budget_files: {budgets: bon/budgets.jsonl, candidates: "bon/candidates/<s0>__k<k>.npz"}
  mmb_bon_n4:                 # 2026-10-13 MMBench2 best-of-N selection (TODO 18 + 17; replaces mmb_cem), N = 4
    machine: "$NODE_D (presumed; not probed -- the 2026-10-20 probe covered the LIBERO banks only)"
    records: "mmb_bon_n4_records_{task}.jsonl"
    N: 4
    settings: [none]
    baseline_run: null
    task_section: mmbench2       # model, task, starts, H, predicate, policy (sigma 0.1), inference as mmb_base
    tasks: [reacher-easy]
    seeds_per_start: 5
    max_starts: 50               # first 50 frozen starts (s000..s049)
    run_dir_hint: $MMBENCH2_ROOT/out
    env_adapter: "mmb_env_adapter:replay_unit"
    candidates: 64               # per (start, seed): 64 candidates imagined once, shared by all N levels
    noise_master_seed: 20261023  # seeds = RandomState(m).randint(0, 2**31-1, (50, 5, 64)); eps = RandomState(seed).randn(500, A)
    candidate_definition: "one noise sequence eps of the protocol policy (BC head + 0.1 eps); imagined closed loop in the
                           world model (mmb_run rollout); executing it = the protocol policy closed loop in the REAL env
                           with the same eps (as mmb_base truth)"
    selection_rule: "argmax of the reward head's predicted return (sum over the 500 imagined steps, plan_cem.reward_cost
                     convention) over candidates 0..N-1 (nested prefixes); ties -> lowest index; N = 1 -> candidate 0"
    model_readout: {scored: "the selected candidate's own imagined rollout (the one it was selected on; primary)",
                    fresh: "independent re-imagination of the selected eps (out/bon/fresh.jsonl)"}
